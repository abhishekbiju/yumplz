# xcodegen spec — regenerate the Xcode project by running `xcodegen generate`
# from the repo root. The .xcodeproj is git-ignored; this file is the source of
# truth for project configuration.

name: MealKit

options:
  bundleIdPrefix: com.abhishekbiju
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  defaultConfig: Debug
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

configs:
  Debug: debug
  Release: release

# ── Swift Package Manager dependencies ────────────────────────────────────────
packages:
  # Swift-native wrapper around llama.cpp (ADR 0004). Versioning mirrors
  # llama.cpp build numbers (major.build.patch). The CoreML/Metal backend is
  # enabled by default on Apple Silicon — no extra build flags required.
  LlamaSwift:
    url: https://github.com/mattt/llama.swift
    from: "2.9055.0"

  # Argmax Open-Source SDK — ships WhisperKit (CoreML port of OpenAI Whisper)
  # alongside TTSKit / SpeakerKit. We only import the WhisperKit product.
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    from: "1.0.0"

# ── Targets ───────────────────────────────────────────────────────────────────
targets:
  MealKit:
    type: application
    platform: iOS
    sources:
      - path: MealKit
        excludes:
          - "**/.DS_Store"
    resources:
      - path: MealKit/Resources
        optional: true
    dependencies:
      - package: LlamaSwift
        product: LlamaSwift
      - package: ArgmaxOSS
        product: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abhishekbiju.mealkit
        PRODUCT_NAME: MealKit
        TARGETED_DEVICE_FAMILY: "1"  # iPhone only at V1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: MealKit/MealKit.entitlements
    # Explicit Info.plist — the auto-generated variant silently drops
    # UIBackgroundModes (not in Apple's INFOPLIST_KEY_* allowlist).
    info:
      path: MealKit/Info.plist
      properties:
        CFBundleDisplayName: MealKit
        LSApplicationCategoryType: public.app-category.food-and-drink
        UIStatusBarStyle: UIStatusBarStyleDefault
        UILaunchScreen:
          UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - remote-notification
          - audio
          - processing
        NSUserActivityTypes:
          - com.abhishekbiju.mealkit.importRecipe
        NSCameraUsageDescription: "MealKit uses the camera to import recipes from photos of cookbooks, magazines, and handwritten notes."
        NSPhotoLibraryUsageDescription: "MealKit reads photos from your library to import recipes from screenshots and saved images."
        NSPhotoLibraryAddUsageDescription: "MealKit saves recipe photos to your library when you choose to export them."
        NSMicrophoneUsageDescription: "MealKit listens for voice commands while you cook (e.g. set a timer, stop a timer) when you tap the microphone."
        NSSpeechRecognitionUsageDescription: "MealKit converts your spoken timer commands to text so it can act on them."
    entitlements:
      path: MealKit/MealKit.entitlements
      properties:
        # ── Capabilities requiring a PAID Apple Developer Program account ──
        # Uncomment these blocks once you enroll at developer.apple.com/enroll
        # (required before TestFlight or App Store submission).
        #
        # com.apple.developer.icloud-container-identifiers:
        #   - iCloud.com.abhishekbiju.mealkit
        # com.apple.developer.icloud-services:
        #   - CloudKit
        # com.apple.developer.ubiquity-container-identifiers: []
        # com.apple.developer.applesignin:
        #   - Default
        # aps-environment: development
        #
        # ── Placeholder to keep the entitlements file non-empty ───────────
        com.apple.developer.associated-domains: []

  MealKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MealKitTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abhishekbiju.mealkit.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MealKit.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/MealKit"
    dependencies:
      - target: MealKit

schemes:
  MealKit:
    build:
      targets:
        MealKit: all
        MealKitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MealKitTests
    archive:
      config: Release
