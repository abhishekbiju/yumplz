# xcodegen spec — regenerate the Xcode project by running `xcodegen generate`
# from the repo root. The .xcodeproj is git-ignored; this file is the source of
# truth for project configuration.

name: Yumplz

options:
  bundleIdPrefix: com.abhishekbiju
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  defaultConfig: Debug
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

configs:
  Debug: debug
  Release: release

# ── Swift Package Manager dependencies ────────────────────────────────────────
packages:
  LlamaSwift:
    url: https://github.com/mattt/llama.swift
    from: "2.9055.0"

  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    from: "1.0.0"

# ── Targets ───────────────────────────────────────────────────────────────────
targets:
  Yumplz:
    type: application
    platform: iOS
    sources:
      - path: Yumplz
        excludes:
          - "**/.DS_Store"
    resources:
      - path: Yumplz/Resources
        optional: true
    dependencies:
      - package: LlamaSwift
        product: LlamaSwift
      - package: ArgmaxOSS
        product: WhisperKit
      - target: YumplzShareExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abhishekbiju.yumplz
        PRODUCT_NAME: Yumplz
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Yumplz/Yumplz.entitlements
    info:
      path: Yumplz/Info.plist
      properties:
        CFBundleDisplayName: yumplz
        LSApplicationCategoryType: public.app-category.food-and-drink
        UIStatusBarStyle: UIStatusBarStyleDefault
        UILaunchScreen:
          UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - remote-notification
          - audio
          - processing
        NSUserActivityTypes:
          - com.abhishekbiju.yumplz.importRecipe
        CFBundleURLTypes:
          - CFBundleURLName: com.abhishekbiju.yumplz.import
            CFBundleURLSchemes:
              - yumplz
        NSCameraUsageDescription: "yumplz uses the camera to import recipes from photos of cookbooks, magazines, and handwritten notes."
        NSPhotoLibraryUsageDescription: "yumplz reads photos from your library to import recipes from screenshots and saved images."
        NSPhotoLibraryAddUsageDescription: "yumplz saves recipe photos to your library when you choose to export them."
        NSMicrophoneUsageDescription: "yumplz listens for voice commands while you cook (e.g. set a timer, stop a timer) when you tap the microphone."
        NSSpeechRecognitionUsageDescription: "yumplz converts your spoken timer commands to text so it can act on them."
    entitlements:
      path: Yumplz/Yumplz.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.abhishekbiju.yumplz
        com.apple.developer.associated-domains: []

  YumplzShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: YumplzShareExtension
      - path: Yumplz/Services/PendingImportStore.swift
      - path: Yumplz/Services/Import/SocialPlatformDetector.swift
      - path: Yumplz/Services/ShareImportPreferences.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abhishekbiju.yumplz.shareextension
        INFOPLIST_FILE: YumplzShareExtension/Info.plist
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    entitlements:
      path: YumplzShareExtension/YumplzShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.abhishekbiju.yumplz
    info:
      path: YumplzShareExtension/Info.plist
      properties:
        CFBundleDisplayName: yumplz
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsMovieWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 1
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController

  YumplzTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: YumplzTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abhishekbiju.yumplz.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Yumplz.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Yumplz"
    dependencies:
      - target: Yumplz

schemes:
  Yumplz:
    build:
      targets:
        Yumplz: all
        YumplzShareExtension: all
        YumplzTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - YumplzTests
    archive:
      config: Release
